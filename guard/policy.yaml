# Default policy shipped with the guard.
mode: autonomous            # autonomous: "ask" -> deny with reason. interactive: prompt the human.
network:
  allow: [pypi.org, github.com, api.github.com, api.mybank-internal.com]
  unknown: ask              # becomes deny when the session is tainted
files:
  deny: [.env, ".env.*", "*.pem", "*.key", ~/.ssh, ~/.aws]
  write_only_in: ./
tainted_session:
  deny: [git_push, network_unknown, install_package]
# Fail closed: any tool NOT listed here taints the session when it returns content.
# Also tainting: read_file outside the project, shell commands that fetch from the network.
trusted_sources: [read_file, write_file, list_files, run_tests, shell]
handover_after_denials: 3
