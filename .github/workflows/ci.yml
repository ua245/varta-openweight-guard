name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Pytest
        run: python -m pytest -q
      - name: Proxy smoke
        run: |
          python -m proxy &
          sleep 2
          curl -sf http://127.0.0.1:8787/health | tee /tmp/health.json
          grep -q '"ok": true' /tmp/health.json || grep -q '"ok":true' /tmp/health.json
          curl -sf -X POST http://127.0.0.1:8787/v1/tools/execute \
            -H 'Content-Type: application/json' \
            -d '{"tool":"read_file","args":{"path":"README.md"}}' | tee /tmp/tool.json
          grep -q '"blocked": false' /tmp/tool.json || grep -q '"blocked":false' /tmp/tool.json
          # chat without backend must fail closed
          code=$(curl -s -o /tmp/chat.json -w '%{http_code}' -X POST http://127.0.0.1:8787/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"x","messages":[{"role":"user","content":"hi"}]}')
          test "$code" = "503"

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check llm-map
        run: cargo check --manifest-path llm-map/Cargo.toml
      - name: cargo run llm-map (inventory)
        run: cargo run --manifest-path llm-map/Cargo.toml
      - name: map file exists
        run: test -f llm_map.json && head -c 200 llm_map.json
